services:
  mysql:
    image: mysql:8.4
    container_name: mysql_tantakatu
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - appnet

  mongodb:
    image: mongo:7
    container_name: mongodb_usuarios
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: bd_usuarios
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - appnet

  users:
    build: ./serviceUsers
    image: usuarios:2.0
    container_name: service_users
    restart: unless-stopped
    env_file:
      - ./serviceUsers/.env
    # Sobrescribe lo del .env para que apunte al contenedor de MongoDB
    environment:
      NODE_ENV: production
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_ROOT_USER}
      MONGO_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - appnet

  items:
    build: ./serviceItems
    image: items:2.0
    container_name: service_items
    restart: unless-stopped
    env_file:
      - ./serviceItems/.env
    # Sobrescribe lo del .env para que apunte al contenedor de MySQL
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    ports:
      - "3002:3002"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - appnet

  categories:
    build: ./serviceCategories
    image: categories:2.0
    container_name: service_categories
    restart: unless-stopped
    env_file:
      - ./serviceCategories/.env
    # Sobrescribe lo del .env para que apunte al contenedor de MySQL
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    ports:
      - "3005:3005"
    networks:
      - appnet

  nginx:
    image: nginx:latest
    container_name: nginx_gateway
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - users
      - items
      - categories
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
