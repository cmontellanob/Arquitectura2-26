worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;

    # =====================
    # UPSTREAMS (nombres de servicio del docker-compose)
    # =====================
    upstream users_service {
        server users:3000;
    }

    upstream items_service {
        server items:3002;
    }

    upstream categories_service {
        server categories:3005;
    }

    server {
        listen 80;
        server_name localhost;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # =====================
        # BACKEND USERS
        # =====================
        location /api/v1/users {
            proxy_pass http://users_service;
        }

        # =====================
        # BACKEND LOGIN
        # =====================
        location /api/v1/login {
            proxy_pass http://users_service;
        }

        # =====================
        # BACKEND CATEGORIES
        # =====================
        location /api/v1/categories {
            proxy_pass http://categories_service;
        }

        # =====================
        # BACKEND ITEMS
        # =====================
        location /api/v1/items {
            proxy_pass http://items_service;
        }
    }
}
